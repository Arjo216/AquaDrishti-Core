version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: aquasentinel_timescaledb
    environment:
      POSTGRES_USER: aqua_admin
      POSTGRES_PASSWORD: aqua_secure_password_2026
      POSTGRES_DB: aquasentinel_db
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  timescale_data: